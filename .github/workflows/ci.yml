name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No secrets are referenced anywhere in this workflow. The whole suite runs in
# mock mode, which is the point: contributors and CI never need an API key.
env:
  AGENT_MODE: mock

jobs:
  quality:
    name: Lint, test and demo (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q --cov=core --cov-report=term-missing

      - name: Run every demo end to end
        # Guards the promise in the README: a fresh machine with no API key
        # can clone this repo and see the agents actually run.
        run: make demo

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

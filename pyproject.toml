[project]
name = "ai-agent-portfolio"
version = "0.1.0"
description = "Production-minded AI agent systems built from scratch on the Anthropic API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Deliberately minimal. No agent framework: the orchestration in `core/` is the
# point of this repository, so it is written by hand against the raw SDK.
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.9",
    # Windows ships no IANA time zone database, so `zoneinfo` cannot resolve
    # names like "Europe/Berlin" without this. Unix systems already have one.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Writing the morning brief as a real .xlsx workbook. Optional: the brief also
# writes as CSV with no dependencies at all, which is what `make demo` uses.
xlsx = ["openpyxl>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "console"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.pytest.ini_options]
# Each agent keeps its tests next to its code, so `agents` is a test root too.
testpaths = ["tests", "agents", "console"]
addopts = "-q"
